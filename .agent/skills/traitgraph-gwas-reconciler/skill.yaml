id: traitgraph-gwas-reconciler
name: GWAS PrePubMatch
description: Connect pre-publication GWAS summary-stat submission metadata to published literature via Google Science Skills; returns ranked related publications and same-study assessment.
version: 0.1.0
entrypoint: scripts/reconcile_gwas.py
inputs:
  metadata:
    type: object
    description: Messy pre-publication GWAS metadata containing study title, authors, reported trait, cohort, and summary-stat file clues.
    required: true
outputs:
  graph_ready_json:
    type: object
    description: Provenance-rich graph-ready JSON containing deterministic reconciliation confidence, EFO/MONDO normalized trait mapping, and biocurator review flags.
